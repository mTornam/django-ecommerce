{% load static %}
<aside id="side-cart">
  <div class="wrapper"></div>
  <div class="cart p-3">
    <div class="py-3">
      <!-- Heading -->
      <div class="d-flex justify-content-between align-items-center">
        <div class="">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" height="30" class="size-6">
            <path
              d="M2.25 2.25a.75.75 0 0 0 0 1.5h1.386c.17 0 .318.114.362.278l2.558 9.592a3.752 3.752 0 0 0-2.806 3.63c0 .414.336.75.75.75h15.75a.75.75 0 0 0 0-1.5H5.378A2.25 2.25 0 0 1 7.5 15h11.218a.75.75 0 0 0 .674-.421 60.358 60.358 0 0 0 2.96-7.228.75.75 0 0 0-.525-.965A60.864 60.864 0 0 0 5.68 4.509l-.232-.867A1.875 1.875 0 0 0 3.636 2.25H2.25ZM3.75 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0ZM16.5 20.25a1.5 1.5 0 1 1 3 0 1.5 1.5 0 0 1-3 0Z" />
          </svg>
          <b style="vertical-align: middle">Cart</b>
        </div>
        <!-- close -->
        <button class="close-btn" id="close-cart" onclick="toggleSideCart()">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="24" viewBox="0 0 24 24" stroke-width="2.5"
            stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
    <div class="cart-body">
      <div class="d-flex justify-content-between cart-info">
        <span class="text-danger fw-semibold" id="clear-cart">Clear</span>
        <span class="fw-semibold text-muted"> <span id="count">0</span> item(s)</span>
      </div>
      <div id="cart-items"></div>
    </div>
    <!-- cart footer -->
    <div class="cart-footer">
      <div id="cart-summary" class="bt-hr">
        <div class="d-flex justify-content-between fs-4">
          <!-- total -->
          <span class="fw-semibold"> Total</span>
          <span class="total">$0.00</span>
        </div>
      </div>
      <div class="bt-hr">
        <!-- buttons -->
        <div class="d-flex justify-content-between cart-footer-btns">
          <a href="{% url 'shop:product_list' %}">
            <span>continue shopping</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" height="16" viewBox="0 0 24 24" stroke-width="3.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
          </a>
          <a href="{% url 'shop:checkout' %}" id="checkout-btn">
            <span>checkout</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" height="16" stroke-width="2.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>
  </div>
  <!-- Templates -->
  <template id="cart-item-template">
    <div class="bt-hr">
      <div class="d-flex justify-content-between gap-2">
        <!-- cart item -->
        <div>
          <!-- details -->
          <b class="p-name">product name</b>
          <span class="p-qty">x1</span>
        </div>
        <div class="d-flex gap-2 align-items-baseline">
          <!-- price & delete -->
          <b class="p-price">$35.40</b>
          <button class="delete-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" height="14" class="size-6">
              <path fill-rule="evenodd"
                d="M16.5 4.478v.227a48.816 48.816 0 0 1 3.878.512.75.75 0 1 1-.256 1.478l-.209-.035-1.005 13.07a3 3 0 0 1-2.991 2.77H8.084a3 3 0 0 1-2.991-2.77L4.087 6.66l-.209.035a.75.75 0 0 1-.256-1.478A48.567 48.567 0 0 1 7.5 4.705v-.227c0-1.564 1.213-2.9 2.816-2.951a52.662 52.662 0 0 1 3.369 0c1.603.051 2.815 1.387 2.815 2.951Zm-6.136-1.452a51.196 51.196 0 0 1 3.273 0C14.39 3.05 15 3.684 15 4.478v.113a49.488 49.488 0 0 0-6 0v-.113c0-.794.609-1.428 1.364-1.452Zm-.355 5.945a.75.75 0 1 0-1.5.058l.347 9a.75.75 0 1 0 1.499-.058l-.346-9Zm5.48.058a.75.75 0 1 0-1.498-.058l-.347 9a.75.75 0 0 0 1.5.058l.345-9Z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </template>

  <template id="empty-cart-template">
    <div class="text-center" style="height: 100%; place-content: center">
      <img src="{% static 'img/empty-cart.svg' %}" width="70%" />
      <p class="mt-3">Your cart is empty</p>
    </div>
  </template>
</aside>

<style>
  body {
    overflow-x: hidden;
  }

  aside {
    display: flex;
    position: fixed;
    visibility: hidden;
    inset: 0;
    overflow: hidden;
    transition: 0.3s all ease;
    transform: translateX(100%);
    z-index: 2000;
  }

  aside.open {
    visibility: visible;
    transform: translateX(0);
  }

  .wrapper {
    flex: 1;
    background-color: #100d0db3;
    pointer-events: none;
  }

  .cart {
    background-color: white;
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    width: 425px;
    float: right;
    box-shadow: -4px 0px 20px 0px rgb(42 42 42 / 8%);
  }

  .bt-hr {
    border-top: 1px solid grey;
    padding-top: 0.75em;
    padding-bottom: 0.75em;
  }

  .close-btn {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;

    background: none;
    padding: 0;
    margin: 0;
    border: none;
  }

  .cart-body {
    height: 100%;
    overflow: auto;
  }

  .cart-info {
    position: sticky;
    top: 0;
    z-index: 1000;
    background-color: white;
  }

  .delete-btn {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    background-color: transparent;

    color: rgba(255, 0, 0, 0.744);
    border-radius: 0.25em;
    line-height: 0;
    padding: 2px;
    margin: 0;
    border: none;
  }

  .cart-footer-btns a {
    display: inline-flex;
    align-items: center;
    gap: 0.2em;

    padding: 4px 12px;
    border-radius: 20px;
    font-weight: bolder;
    text-transform: uppercase;
    text-decoration: none;
    color: initial;
    font-size: 12px;
    border: none;
    background-color: rgba(97, 97, 97, 0.562);
  }

  #checkout-btn.disabled {
    opacity: 0.5;
    pointer-events: none;
    color: red;
  }



  #cart-summary .total {
    font-weight: 700;
    font-size: 1.4rem;
  }

  body.no-scroll {
    overflow: hidden;
  }

  button svg {
    pointer-events: none;
  }

  #cart-items {
    height: 100%;
  }

  #clear-cart {
    cursor: pointer;
  }

  @media (max-width:450px) {
    .cart {
      width: 100%;
    }
  }
</style>
