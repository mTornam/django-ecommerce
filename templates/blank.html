<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <title>Beauty Shop - {% block title %} {% endblock %} </title> -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <div class="bg-body-secondary d-flex align-items-center justify-content-center" style="width: 100%; height: 100dvh;">
    <div class="container p-3 bg-white" style="max-height: 80%; max-width: 458px;">
      <h1 class="text-center">Chekout Form</h1>
      <hr>

      <div class="form-wrapper">
        <form>
          <input hidden type="text" value="200.00">
          <div class="mb-2">
            <label for="name" class="form-label">Name</label>
            <input name="name" type="text" class="form-control" placeholder="E.g. John Mensah" required>
          </div>

          <div class="mb-2">
            <label for="email" class="form-label">Email</label>
            <input name="email" type="email" class="form-control" placeholder="john@mail.com" required>
          </div>

          <div class="text-center">
            <p>Amount to pay: <span>200.00</span> <span>GHS</span></p>
          </div>

          <hr>
          <div class="text-center">
            <button type="button" class="btn btn-primary">Place Order</button>
          </div>

        </form>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
